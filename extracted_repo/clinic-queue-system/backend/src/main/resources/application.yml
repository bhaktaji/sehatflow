server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: Lax
        secure: ${APP_COOKIE_SECURE:false}

spring:
  application:
    name: clinic-queue-backend
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5433/clinicqueue}
    username: ${APP_DB_USER:postgres}
    password: ${APP_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  mvc:
    problemdetails:
      # Handled by our own GlobalExceptionHandler so every error carries the
      # stable "code" extension.
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    bcrypt-strength: ${APP_BCRYPT_STRENGTH:10}
    cookie-secure: ${APP_COOKIE_SECURE:false}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    clinic-name: Sunrise Family Clinic
    clinic-slug: sunrise-family
    timezone: Asia/Kolkata
    owner-username: owner
    owner-password: owner123
    receptionist-username: reception
    receptionist-password: recep123
    doctor-username: doctor
    doctor-password: doc123
    doctor-display-name: Dr. Asha Menon
    doctor-specialty: Family Physician
  ratelimit:
    login-per-minute: ${APP_LOGIN_RATE:30}
    public-per-minute: ${APP_PUBLIC_RATE:120}
