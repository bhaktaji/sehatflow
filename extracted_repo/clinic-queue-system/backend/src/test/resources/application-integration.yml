spring:
  datasource:
    url: ${APP_IT_DB_URL:jdbc:postgresql://localhost:5433/clinicqueue_test}
    username: ${APP_DB_USER:postgres}
    password: ${APP_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  seed:
    enabled: true
  ratelimit:
    login-per-minute: 300
    public-per-minute: 300
